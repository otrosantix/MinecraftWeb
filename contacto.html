<main>
  <section class="seccion" style="padding-top: 7rem;">
    <div class="container">
      <h2 class="seccion__titulo">Contactanos</h2>
      <p class="text-center">¿Tienes alguna duda, sugerencia o quieres reportar algo de la pagina? Escribenos y te respondemos lo antes posible.</p>

      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <form class="formulario-contacto">
            <div class="campo">
              <label for="nombre">Nombre</label>
              <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>
            </div>

            <div class="campo">
              <label for="correo">Correo electronico</label>
              <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" required>
            </div>

            <div class="campo">
              <label for="asunto">Asunto</label>
              <input type="text" id="asunto" name="asunto" placeholder="Sobre que nos quieres escribir">
            </div>

            <div class="campo">
              <label for="mensaje">Mensaje</label>
              <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aqui..." required></textarea>
            </div>

            <div class="campo-check">
              <input type="checkbox" id="acepto" name="acepto" required>
              <label for="acepto">Acepto que me respondan por correo</label>
            </div>

            <button type="submit" class="boton">Enviar mensaje</button>
          </form>
        </div>
      </div>
    </div>
  </section>
</main>
